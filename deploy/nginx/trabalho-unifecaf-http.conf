# Trabalho Unifecaf — entrada HTTP
# Copie para o sites-available do Nginx e ajuste server_name.
# Em produção este bloco só redireciona para HTTPS, exceto o desafio do certificado.

server {
    listen 80;
    listen [::]:80;
    server_name trabalho-unifecaf.unifecaf.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Trabalho Unifecaf — entrada HTTPS
# O Nginx termina o TLS e encaminha para o Flask em 127.0.0.1:5000.
# No .env de produção: FLASK_ENV=production, COOKIE_SECURE=true, TRUST_PROXY=true, BIND_HOST=127.0.0.1

upstream trabalho_unifecaf {
    server 127.0.0.1:5000;
    keepalive 8;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name trabalho-unifecaf.unifecaf.com;

    ssl_certificate     /etc/letsencrypt/live/trabalho-unifecaf.unifecaf.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trabalho-unifecaf.unifecaf.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TrabalhoUnifecafSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 256k;

    location / {
        proxy_pass http://trabalho_unifecaf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
